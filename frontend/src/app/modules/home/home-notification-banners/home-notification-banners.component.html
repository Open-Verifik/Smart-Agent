@if (banners().length) {
<div class="home-banners">
@for (banner of banners(); track trackById($index, banner)) {
    <section class="home-banner">
        <span class="home-banner__icon" aria-hidden="true">
            <mat-icon [svgIcon]="categoryIcon(banner.category)"></mat-icon>
        </span>
        <div class="home-banner__copy">
            <h2 class="home-banner__title">{{ banner.content.title }}</h2>
            @if (banner.content.summary) {
                <p class="home-banner__summary">{{ banner.content.summary }}</p>
            }
            @if (showCta(banner)) {
                <button mat-stroked-button type="button" (click)="openCta(banner)">
                    {{ banner.cta.label || ('appNotifications.inbox.ctaDefault' | transloco) }}
                </button>
            }
        </div>
        <button
            class="home-banner__dismiss"
            type="button"
            [disabled]="dismissingId() === banner.notificationId"
            [attr.aria-label]="'appNotifications.banners.dismissAria' | transloco"
            (click)="dismissBanner(banner)"
        >
            <mat-icon aria-hidden="true" [svgIcon]="'heroicons_outline:x-mark'"></mat-icon>
        </button>
    </section>
}
</div>
}
