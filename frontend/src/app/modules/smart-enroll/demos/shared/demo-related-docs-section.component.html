<section
    class="mt-10 rounded-2xl border border-stone-200 bg-white p-5 sm:p-6 dark:border-gray-800 dark:bg-gray-900"
    aria-labelledby="related-docs-heading"
>
    <div class="mb-5 flex flex-col gap-1 sm:flex-row sm:items-end sm:justify-between">
        <div class="flex items-center gap-3">
            <span class="flex h-9 w-9 shrink-0 items-center justify-center rounded-xl bg-blue-600/10 text-blue-600 dark:text-blue-400">
                <span class="material-symbols-outlined text-xl" aria-hidden="true">menu_book</span>
            </span>
            <div>
                <h3 id="related-docs-heading" class="text-base font-semibold tracking-tight text-stone-900 dark:text-white">
                    {{ 'smartEnrollDemos.common.relatedDocsTitle' | transloco }}
                </h3>
                <p class="mt-0.5 text-xs text-stone-500 dark:text-stone-400">
                    {{ 'smartEnrollDemos.common.relatedDocsSubtitle' | transloco }}
                </p>
            </div>
        </div>
    </div>

    <div class="grid gap-3 sm:grid-cols-2">
        @for (doc of items; track doc.href) {
            <a
                [href]="doc.href"
                target="_blank"
                rel="noopener noreferrer"
                class="group flex flex-col rounded-xl border border-stone-200 bg-stone-50/70 px-4 py-3.5 text-left transition-colors hover:border-blue-500/40 hover:bg-white focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-600/40 dark:border-gray-800 dark:bg-gray-800/40 dark:hover:border-blue-500/50 dark:hover:bg-gray-800/80"
            >
                <div class="mb-2 flex items-start justify-between gap-2">
                    <span
                        class="inline-flex shrink-0 items-center rounded-md border px-2 py-0.5 font-mono text-[0.625rem] font-bold uppercase tracking-wide tabular-nums"
                        [ngClass]="
                            doc.badgeMuted
                                ? 'border-stone-200 bg-stone-100 text-stone-600 dark:border-gray-700 dark:bg-gray-800 dark:text-stone-400'
                                : 'border-blue-200 bg-blue-50 text-blue-700 dark:border-blue-900 dark:bg-blue-950/60 dark:text-blue-300'
                        "
                    >
                        {{ doc.badge }}
                    </span>
                    <span
                        class="material-symbols-outlined shrink-0 text-lg text-stone-400 transition-colors group-hover:text-blue-600 dark:group-hover:text-blue-400"
                        aria-hidden="true"
                    >
                        open_in_new
                    </span>
                </div>
                <p class="text-sm font-semibold text-stone-900 transition-colors group-hover:text-blue-600 dark:text-white dark:group-hover:text-blue-400">{{ doc.title }}</p>
                <p class="mt-1 text-xs leading-relaxed text-stone-500 dark:text-stone-400">{{ doc.description }}</p>
            </a>
        }
    </div>
</section>
