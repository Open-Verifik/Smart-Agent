<div class="space-y-2">
    <div class="flex flex-wrap items-center justify-between gap-2">
        <label class="block text-sm font-semibold text-on-surface">
            {{ label }}
            @if (required) {
                <span class="text-error">{{ 'smartEnrollDemos.common.requiredStar' | transloco }}</span>
            }
        </label>
        <div
            class="inline-flex shrink-0 rounded-xl border border-stone-200 bg-stone-100 p-1 dark:border-gray-700 dark:bg-gray-800"
            role="group"
            [attr.aria-label]="label + ' input mode'"
        >
            <button
                type="button"
                [attr.aria-pressed]="mode === 'rows'"
                (click)="switchToRows()"
                class="min-h-[32px] px-3 py-1 text-xs font-semibold rounded-lg transition-all"
                [ngClass]="
                    mode === 'rows'
                        ? 'bg-white text-stone-900 shadow-xs dark:bg-gray-900 dark:text-white'
                        : 'text-stone-600 hover:text-stone-900 dark:text-stone-400 dark:hover:text-white'
                "
            >
                Key / value
            </button>
            <button
                type="button"
                [attr.aria-pressed]="mode === 'json'"
                (click)="switchToJson()"
                class="min-h-[32px] px-3 py-1 text-xs font-semibold rounded-lg transition-all"
                [ngClass]="
                    mode === 'json'
                        ? 'bg-white text-stone-900 shadow-xs dark:bg-gray-900 dark:text-white'
                        : 'text-stone-600 hover:text-stone-900 dark:text-stone-400 dark:hover:text-white'
                "
            >
                JSON
            </button>
        </div>
    </div>
    @if (hint) {
        <p class="text-xs text-stone-500 dark:text-stone-400">{{ hint }}</p>
    }

    @if (mode === 'json') {
        <div class="space-y-2">
            <div class="flex flex-wrap items-center gap-2">
                <button
                    type="button"
                    (click)="applyJson()"
                    class="text-xs font-semibold text-blue-600 hover:underline underline-offset-2 dark:text-blue-400"
                >
                    Format & validate
                </button>
                <span class="text-[0.65rem] text-stone-500 dark:text-stone-400">Values are stored as strings for the API.</span>
            </div>
            <textarea
                [(ngModel)]="jsonDraft"
                (blur)="applyJson()"
                spellcheck="false"
                rows="10"
                class="demo-input min-h-[11rem] font-mono text-xs leading-relaxed"
                [attr.aria-invalid]="!!jsonError"
            ></textarea>
            @if (jsonError) {
                <p class="text-xs text-red-600 dark:text-red-400" role="alert">{{ jsonError }}</p>
            }
        </div>
    } @else {
        <div class="space-y-2 rounded-xl border border-stone-200 bg-stone-50/70 p-3 dark:border-gray-800 dark:bg-gray-800/40">
            <div class="grid grid-cols-[1fr_1fr_auto] gap-2 text-[0.65rem] font-semibold uppercase tracking-wide text-stone-500 dark:text-stone-400">
                <span>Key</span>
                <span>Value</span>
                <span class="sr-only">Remove</span>
            </div>
            @for (row of rows; track row.id) {
                <div class="grid grid-cols-[1fr_1fr_auto] gap-2 items-center">
                    <input
                        type="text"
                        [value]="row.key"
                        (input)="onRowChange(row.id, 'key', $any($event.target).value)"
                        placeholder="fieldName"
                        class="demo-input min-h-[38px] py-1.5 text-sm"
                    />
                    <input
                        type="text"
                        [value]="row.value"
                        (input)="onRowChange(row.id, 'value', $any($event.target).value)"
                        placeholder="value"
                        class="demo-input min-h-[38px] py-1.5 text-sm"
                    />
                    <button
                        type="button"
                        (click)="removeRow(row.id)"
                        class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg text-stone-400 hover:bg-red-50 hover:text-red-600 dark:hover:bg-red-950/40 dark:hover:text-red-300"
                        aria-label="Remove row"
                    >
                        <span class="material-symbols-outlined text-lg">close</span>
                    </button>
                </div>
            }
            <button
                type="button"
                (click)="addRow()"
                class="mt-1 flex items-center gap-1 text-xs font-semibold text-blue-600 hover:underline dark:text-blue-400"
            >
                <span class="material-symbols-outlined text-base">add</span>
                Add field
            </button>
        </div>
    }
</div>
